<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapa de Seeds | Spawnly</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/api.js" defer></script>
  <script src="js/mapa.js" defer></script>
</head>
<body>

<header class="topo">
  <a class="marca" href="index.html">Spawnly</a>
  <nav aria-label="Principal">
    <a href="index.html">Inicio</a>
    <a href="questionario.html">Questionario</a>
    <a href="resultados.html">Recomendacoes</a>
    <a href="gerenciar.html">Gerenciar seeds</a>
    <a href="mapa.html" aria-current="page">Mapa</a>
  </nav>
</header>

<main class="estreito">
  <p class="etiqueta">EXPLORACAO VISUAL</p>
  <h1>Mapa da Seed</h1>
  <p class="resumo">Visualize os biomas e estruturas gerados a partir do codigo da seed.</p>

  <!-- Formulario para digitar ou selecionar a seed -->
  <form id="form-mapa" class="bloco">
    <fieldset>
      <legend>Parametros do Mundo</legend>
      <div class="campos">
        <div>
          <label for="codigo-seed">Codigo da Seed</label>
          <input id="codigo-seed" type="text" placeholder="Ex: -123456789" required>
        </div>
        <div>
          <label for="edicao-mapa">Edicao</label>
          <select id="edicao-mapa" required>
            <option value="Java">Java</option>
            <option value="Bedrock">Bedrock</option>
          </select>
        </div>
      </div>
    </fieldset>

    <p id="mensagem-mapa" class="mensagem" role="alert"></p>
    <button class="btn" type="submit">Gerar Mapa</button>
  </form>

  <!-- Area reservada onde o Vitor e o Nathaniel vao renderizar o mapa -->
  <section class="bloco" aria-label="Visualizacao do Mapa">
    <h2>Pre-visualizacao</h2>
    <div id="container-mapa" style="width: 100%; min-height: 350px; border: 2px dashed #555; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-top: 12px;">
      <p id="status-mapa">Digite uma seed acima para carregar o mapa.</p>
    </div>
  </section>
</main>

<footer class="rodape">Spawnly — projeto academico de CRUD</footer>

</body>
</html>
