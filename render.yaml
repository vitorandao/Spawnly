# API SQL isolada da hospedagem Vercel.
# Usa o PostgreSQL existente no workspace Render; nao cria nem altera o banco.
services:
  - type: web
    name: spawnly-postgres-api
    runtime: node
    plan: free
    region: virginia
    rootDir: .
    branch: feature/spawnly-render-postgres-integration-20261117
    buildCommand: cd render-bridge && npm install --omit=dev
    startCommand: node render-bridge/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: spawnly-db
          property: connectionString
